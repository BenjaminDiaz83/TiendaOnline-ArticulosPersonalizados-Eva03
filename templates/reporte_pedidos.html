{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h1 class="mb-4">Reporte de Pedidos</h1>

    <div class="row">
        <div class="col-md-6">
            <h2 class="h5">Pedidos por Estado</h2>
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>Estado</th>
                        <th>Cantidad de Pedidos</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in reporte_estados %}
                    <tr>
                        <td>{{ item.estados|title }}</td>
                        <td>{{ item.cantidad }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2">No hay pedidos registrados.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <div class="col-md-6">
            <div id="chartPedidosEstado" style="width: 100%; height: 400px;">
                </div>
        </div>
    </div>
    
    <hr class="my-5">
    <div class="row" id="otras-metricas">
        </div>

</div>
{% endblock content %}
